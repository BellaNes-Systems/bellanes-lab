# Cloud override: Caddy terminates HTTPS and gates the app behind basic auth.
# See docs/deploy.md. Set WEB_PORT=127.0.0.1:8081 in .env so nginx isn't exposed directly.
#
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d --build
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      DEMO_USER: ${DEMO_USER:?set DEMO_USER in .env}
      DEMO_PASS_HASH: ${DEMO_PASS_HASH:?set DEMO_PASS_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
